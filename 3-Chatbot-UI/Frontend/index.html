<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>UI Chatbot</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body class="bg-gray-50 font-sans text-gray-800">
    <div class="flex h-dvh overflow-hidden flex-col">
      <!-- Header -->
      <header class="border-b border-gray-200 bg-white px-4 py-4 md:px-8">
        <div class="mx-auto flex max-w-4xl items-center gap-3">
          <div
            class="flex size-9 items-center justify-center rounded-xl bg-green-700 text-lg font-bold text-white">
            A
          </div>
          <div>
            <h1 class="text-lg font-semibold">AI Assistant</h1>
            <p class="text-xs text-gray-500">Web search enabled</p>
          </div>
        </div>
      </header>

      <!-- Conversation area -->
      <main class="flex-1 min-h-0 overflow-y-auto bg-gray-50 px-4 py-6 md:px-8">
        <div class="mx-auto flex max-w-3xl flex-col gap-6 message">
          <!-- Example user message
          <div class="flex justify-end">
            <div class="max-w-[85%] rounded-2xl bg-gray-200 px-4 py-3 sm:max-w-[75%]">
              <p>When was the iPhone 16 launched?</p>
            </div>
          </div>

          Example assistant message 
          <div class="flex items-start">
            <div class="min-w-0 flex-1 pt-1 leading-7">
              <p>The iPhone 16 was launched on September 20, 2024.</p>
            </div>
          </div> -->
        </div>
      </main>

      <!-- Message composer -->
      <form class="border-t border-gray-200 bg-white px-4 py-4 md:px-8">
        <div class="mx-auto max-w-3xl">
          <label
            for="message"
            class="sr-only">
            Your message
          </label>

          <div
            class="flex items-end gap-2 rounded-2xl border border-gray-300 bg-white p-2 shadow-sm focus-within:border-green-700 focus-within:ring-2 focus-within:ring-green-100">
            <textarea
              id="message"
              name="message"
              rows="1"
              placeholder="Message your assistant..."
              class="max-h-40 min-h-11 flex-1 resize-none bg-transparent px-3 py-3 text-base outline-none placeholder:text-gray-400"></textarea>

            <button
              type="submit"
              aria-label="Send message"
              class="flex size-11 shrink-0 items-center justify-center rounded-xl bg-green-700 text-white transition hover:bg-green-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-green-700">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                class="size-5"
                aria-hidden="true">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M12 19V5m-7 7 7-7 7 7" />
              </svg>
            </button>
          </div>

          <p class="mt-2 text-center text-xs text-gray-500">
            AI can make mistakes. Verify important information.
          </p>
        </div>
      </form>
    </div>

    <script src="script.js"></script>
  </body>
</html>
